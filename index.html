<script>
  // 1. Đồng hồ thời gian thực
  function updateLiveTime() {
    const now = new Date();
    const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
    document.getElementById('liveDate').innerText = `${days[now.getDay()]}, ${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
    document.getElementById('liveClock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
  }
  setInterval(updateLiveTime, 1000);
  updateLiveTime();

  // 2. Chuyển đổi hướng gió sang tên viết tắt
  function getWindDirName(deg) {
    const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    const index = Math.round(deg / 22.5) % 16;
    return dirs[index];
  }

  // 3. Quy đổi Cấp gió Beaufort
  function getBeaufort(speedKmH) {
    if (speedKmH < 2) return { level: 0, desc: "0/12 Lặng gió" };
    if (speedKmH <= 5) return { level: 1, desc: "1/12 Gió nhẹ" };
    if (speedKmH <= 11) return { level: 2, desc: "2/12 Gió nhẹ" };
    if (speedKmH <= 19) return { level: 3, desc: "3/12 Gió yếu" };
    if (speedKmH <= 28) return { level: 4, desc: "4/12 Gió vừa phải" };
    if (speedKmH <= 38) return { level: 5, desc: "5/12 Gió khá mạnh" };
    if (speedKmH <= 49) return { level: 6, desc: "6/12 Gió mạnh" };
    if (speedKmH <= 61) return { level: 7, desc: "7/12 Gió rất mạnh" };
    if (speedKmH <= 74) return { level: 8, desc: "8/12 Gió giật" };
    if (speedKmH <= 88) return { level: 9, desc: "9/12 Gió rất giật" };
    return { level: 10, desc: "10/12 Bão mạnh" };
  }

  // 4. Lấy dữ liệu thời tiết thực tế từ Open-Meteo cho Phan Thiết
  async function fetchWeatherData() {
    const statusBadge = document.getElementById('statusBadge');
    statusBadge.innerText = "● ĐANG CẬP NHẬT...";
    statusBadge.style.color = "#f59e0b";

    // Đã xóa precipitation_probability khỏi current để tránh lỗi 400
    const apiUrl = "https://api.open-meteo.com/v1/forecast?latitude=10.9333&longitude=108.1000&current=temperature_2m,relative_humidity_2m,apparent_temperature,surface_pressure,cloud_cover,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,dew_point_2m&hourly=wind_speed_10m,wind_direction_10m,precipitation_probability&timezone=Asia%2FBangkok";

    try {
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error("API Error");
      const data = await response.json();
      const current = data.current;
      const nowHour = new Date().getHours();

      // Cập nhật thẻ chính
      document.getElementById('windSpeed').innerText = current.wind_speed_10m.toFixed(1);
      document.getElementById('windGust').innerText = current.wind_gusts_10m.toFixed(1);
      document.getElementById('temp').innerText = `${current.temperature_2m.toFixed(1)} °C`;
      document.getElementById('apparentTemp').innerText = `${current.apparent_temperature.toFixed(1)} °C`;
      document.getElementById('humidity').innerText = `${current.relative_humidity_2m} %`;
      document.getElementById('pressure').innerText = `${Math.round(current.surface_pressure)} hPa`;
      
      // Khả năng mưa lấy từ giờ hiện tại trong mảng hourly
      const currentRainProb = data.hourly.precipitation_probability[nowHour] ?? 0;
      document.getElementById('pop').innerText = `${currentRainProb} %`;

      document.getElementById('cloudCover').innerText = `${current.cloud_cover} %`;
      document.getElementById('uvIndex').innerText = current.uv_index.toFixed(1);
      document.getElementById('visibility').innerText = `${(current.visibility / 1000).toFixed(1)} km`;
      document.getElementById('dewPoint').innerText = `${current.dew_point_2m.toFixed(1)} °C`;

      // Xoay kim la bàn theo hướng gió
      const windDir = current.wind_direction_10m;
      document.getElementById('compassNeedle').setAttribute('transform', `rotate(${windDir} 50 50)`);
      document.getElementById('windDirectionText').innerText = `${getWindDirName(windDir)} (${windDir}°)`;

      // Beaufort
      const beaufort = getBeaufort(current.wind_speed_10m);
      document.getElementById('beaufortText').innerText = beaufort.desc;

      // Trạm thực địa
      document.getElementById('stPhuThuySpeed').innerText = `${current.wind_speed_10m.toFixed(1)} km/h`;
      document.getElementById('stPhuThuyStatus').innerText = beaufort.desc;

      // Trạm Mũi Né
      const muiNeSpeed = current.wind_speed_10m * 1.12;
      document.getElementById('stMuiNeSpeed').innerText = `${muiNeSpeed.toFixed(1)} km/h`;
      document.getElementById('stMuiNeStatus').innerText = getBeaufort(muiNeSpeed).desc;

      // Dự báo ngắn hạn (5 giờ tiếp theo)
      const forecastContainer = document.getElementById('forecastScroll');
      forecastContainer.innerHTML = '';

      for (let i = 0; i < 5; i++) {
        const targetIndex = nowHour + i;
        const timeLabel = `${String((nowHour + i) % 24).padStart(2, '0')}:00`;
        const fcWind = data.hourly.wind_speed_10m[targetIndex]?.toFixed(1) || "--";
        const fcDir = data.hourly.wind_direction_10m[targetIndex] || 0;
        const fcRain = data.hourly.precipitation_probability[targetIndex] ?? 0;

        forecastContainer.innerHTML += `
          <div class="forecast-item">
            <div class="fc-time">${timeLabel}</div>
            <div class="fc-icon" style="transform: rotate(${fcDir}deg); display: inline-block;">⬆</div>
            <div class="fc-dir">${fcDir}° ${getWindDirName(fcDir)}</div>
            <div class="fc-wind">${fcWind} km/h</div>
            <div class="fc-rain">🌧 ${fcRain}%</div>
          </div>
        `;
      }

      statusBadge.innerText = "● MỚI NHẤT";
      statusBadge.style.color = "#4ade80";
    } catch (err) {
      console.error("Lỗi lấy dữ liệu:", err);
      statusBadge.innerText = "● LỖI MẠNG";
      statusBadge.style.color = "#ef4444";
    }
  }

  fetchWeatherData();
  setInterval(fetchWeatherData, 300000);
        </script>
