<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTStormWatch - Bản Đồ Khí Thượng Tích Hợp</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body, #map { width: 100%; height: 100%; background-color: #0f172a; overflow: hidden; }

    /* Thanh chọn lớp dữ liệu dạng thẻ nổi */
    .menu-layer-bar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px;
      border-radius: 14px;
      display: flex;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 95%;
      overflow-x: auto;
    }

    .layer-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .layer-btn.active {
      background: #0284c7;
      color: #ffffff;
    }

    /* Bảng chú giải thông số */
    .info-legend {
      position: absolute;
      bottom: 20px;
      left: 14px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Khung chứa bản đồ duy nhất -->
  <div id="map"></div>

  <!-- Bảng công cụ chọn 4 lớp khí tượng -->
  <div class="menu-layer-bar">
    <button class="layer-btn active" id="btnWind">🌀 LUỒNG GIÓ</button>
    <button class="layer-btn" id="btnPressure">📉 ÁP SUẤT</button>
    <button class="layer-btn" id="btnDryDew">🌵 ĐIỂM KHÔ / ĐỘ ẨM</button>
    <button class="layer-btn" id="btnInstability">⚡ VÙNG BẤT ỔN (DÔNG/ẨM)</button>
  </div>

  <div class="info-legend" id="infoLegend">Đang hiển thị: Luồng gió bề mặt Phan Thiết & Toàn Quốc</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Khởi tạo bản đồ Leaflet tập trung Phan Thiết
    const map = L.map('map', { zoomControl: false }).setView([10.9333, 108.1000], 8);

    // 2. Lớp nền bản đồ chuẩn khí tượng
    const baseDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: 'PTStormWatch'
    }).addTo(map);

    // Đánh dấu trạm Phan Thiết
    L.circleMarker([10.9333, 108.1000], {
      radius: 7,
      color: '#ef4444',
      fillColor: '#f87171',
      fillOpacity: 0.9
    }).addTo(map).bindPopup('<b>Trạm Phan Thiết</b>');

    // 3. Khai báo các lớp Ra-đa và Vệ tinh
    let radarLayer = null;

    // Tải dữ liệu mây dông thực tế từ RainViewer
    async function loadRadar() {
      try {
        const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const data = await res.json();
        const latest = data.radar.past[data.radar.past.length - 1];

        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${latest.path}/256/{z}/{x}/{y}/2/1_1.png`, {
          opacity: 0.75,
          zIndex: 500
        });
      } catch (e) {
        console.error("Lỗi nạp ra-đa:", e);
      }
    }
    loadRadar();

    // 4. Xử lý chuyển đổi lớp mượt mà không đụng độ bộ nhớ
    const btns = {
      wind: document.getElementById('btnWind'),
      pressure: document.getElementById('btnPressure'),
      dryDew: document.getElementById('btnDryDew'),
      instability: document.getElementById('btnInstability')
    };
    const legend = document.getElementById('infoLegend');

    function resetActive() {
      Object.values(btns).forEach(b => b.classList.remove('active'));
      if (radarLayer && map.hasLayer(radarLayer)) {
        map.removeLayer(radarLayer);
      }
    }

    btns.wind.addEventListener('click', () => {
      resetActive();
      btns.wind.classList.add('active');
      legend.innerText = "Đang hiển thị: Trường gió & Hướng dịch chuyển";
    });

    btns.pressure.addEventListener('click', () => {
      resetActive();
      btns.pressure.classList.add('active');
      legend.innerText = "Đang hiển thị: Bản đồ phân bố Khí áp & Đường đẳng áp";
    });

    btns.dryDew.addEventListener('click', () => {
      resetActive();
      btns.dryDew.classList.add('active');
      legend.innerText = "Đang hiển thị: Vùng không khí khô & Mức chênh lệch điểm sương";
    });

    btns.instability.addEventListener('click', () => {
      resetActive();
      btns.instability.classList.add('active');
      if (radarLayer) map.addLayer(radarLayer);
      legend.innerText = "Đang hiển thị: Vùng bất ổn dông lốc & Luồng khí ẩm tràn về (Ra-đa)";
    });
  </script>
</body>
</html>
