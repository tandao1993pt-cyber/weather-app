<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTStormWatch - Trạm Quản Lý</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
        #app-frame { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <!-- Khung nhúng riêng biệt gọi file japan-map.html -->
    <iframe id="app-frame" src="japan-map.html"></iframe>

    <script>
        // Lắng nghe dữ liệu báo cáo gửi về từ japan-map.html
        window.addEventListener("message", function(event) {
            if (event.data && event.data.status === "SUCCESS") {
                console.log("Đã nhận dữ liệu từ japan-map.html thành công!");
                console.log("Tốc độ gió:", event.data.windSpeed, "km/h");
                console.log("Nhiệt độ:", event.data.temp, "°C");
            }
        });

        // Hàm giúp index.html gửi lệnh làm mới dữ liệu sang japan-map.html
        function lamMoiGiaoDien() {
            var frame = document.getElementById('app-frame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage("REFRESH", "*");
            }
        }
    </script>

</body>
</html>
