<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PTStormWatch - Phân Tích Thủ Công</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background-color: #080c14; 
      color: #f0f4f8; 
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Khung tràn toàn màn hình */
    .app-container { 
      width: 100%; 
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a 0%, #080c14 100%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    /* Header hiện đại */
    .header { 
      text-align: center; 
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .location { 
      font-size: 24px; 
      font-weight: 800; 
      color: #ffffff; 
      letter-spacing: 0.5px;
    }
    .app-title { 
      font-size: 11px; 
      color: #38bdf8; 
      font-weight: 700; 
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .update-badge { 
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.7); 
      color: #38bdf8; 
      font-size: 11px; 
      padding: 5px 12px; 
      border-radius: 20px; 
      margin-top: 8px; 
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Băng thông báo ngắn */
    .ticker { 
      background: rgba(56, 189, 248, 0.08); 
      border-left: 4px solid #38bdf8; 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 13px; 
      color: #e2e8f0;
      backdrop-filter: blur(5px);
    }

    /* Bảng thông số 3 ô tràn rộng */
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
    }
    .stat-box { 
      background: rgba(30, 41, 59, 0.5); 
      padding: 12px 8px; 
      border-radius: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      text-align: center;
    }
    .stat-label { 
      font-size: 11px; 
      color: #94a3b8; 
      margin-bottom: 4px; 
    }
    .stat-value { 
      font-size: 15px; 
      font-weight: 700; 
      color: #ffffff; 
    }

    /* Ô hiển thị bản đồ tràn lề */
    .map-box { 
      width: 100%;
      background: #020617; 
      border-radius: 18px; 
      overflow: hidden; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      min-height: 200px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .map-box img { 
      width: 100%; 
      height: auto; 
      display: block; 
      object-fit: cover; 
    }

    /* Ô nội dung phân tích từ Play.txt ở dưới cùng */
    .analysis-box { 
      background: rgba(30, 41, 59, 0.5); 
      border-radius: 18px; 
      padding: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
    }
    .analysis-header { 
      font-size: 13px; 
      font-weight: 700; 
      color: #f59e0b; 
      margin-bottom: 10px; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    .analysis-content { 
      font-size: 13px; 
      color: #cbd5e1; 
      line-height: 1.6; 
      white-space: pre-line; 
    }

    /* Trạng thái chưa cập nhật / Máy chủ bận */
    .empty-text { 
      text-align: center; 
      color: #ef4444; 
      padding: 16px 0; 
      font-size: 13px; 
      font-weight: 500; 
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <div class="location">Phan Thiết</div>
    <div class="app-title">PTSTORM WATCH • BẢN TIN THỦ CÔNG</div>
    <div id="updateTime" class="update-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="timeText">Đang kiểm tra thời gian...</span>
    </div>
  </div>

  <!-- Băng thông báo ngắn -->
  <div id="tickerBox" class="ticker">📢 Đang kết nối máy chủ dữ liệu...</div>

  <!-- 3 Thông số chính (Đơn vị gió đã đổi sang km/h) -->
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">🌧️ Mưa</div>
      <div id="rainVal" class="stat-value">--</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">💧 Độ ẩm</div>
      <div id="humidityVal" class="stat-value">--</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">💨 Hướng gió</div>
      <div id="windVal" class="stat-value">--</div>
    </div>
  </div>

  <!-- Ô chứa ảnh bản đồ -->
  <div id="mapContainer" class="map-box"></div>

  <!-- Ô hiển thị phân tích từ Play.txt -->
  <div class="analysis-box">
    <div class="analysis-header">📝 Nhận Định Chuyên Sâu</div>
    <div id="analysisContent" class="analysis-content">Đang đồng bộ dữ liệu...</div>
  </div>
</div>

<script>
  // Link kết nối trực tiếp file Play.txt trên GitHub
  const playTxtUrl = "https://raw.githubusercontent.com/tandao1993pt-cyber/weather-app/main/Play.txt";

  const dataStore = {
    hasData: true, // Đổi sang false nếu bạn muốn chủ động tạm dừng phát tin
    scheduledSlot: "19:00", 
    rain: "2.0 mm",
    humidity: "82%",
    wind: "16 km/h Đông", // Đã đổi sang km/h
    imageUrl: "https://via.placeholder.com/600x320/020617/38bdf8?text=Ban+Do+Thoi+Tiet+Phan+Thiet",
    tickerText: "Mũi Né & Phan Thiết chiều tối có khả năng xuất hiện mưa dông cục bộ."
  };

  async function fetchPlayTxt() {
    const analysisContentEl = document.getElementById("analysisContent");
    const statusDotEl = document.getElementById("statusDot");
    const timeTextEl = document.getElementById("timeText");

    if (!dataStore.hasData) {
      analysisContentEl.innerHTML = `<div class="empty-text">[Máy chủ bận / Chưa có bản tin mới]</div>`;
      statusDotEl.style.backgroundColor = "#ef4444";
      statusDotEl.style.boxShadow = "0 0 8px #ef4444";
      return;
    }

    try {
      // Gọi dữ liệu từ GitHub kèm mã chống lưu cache cũ
      const response = await fetch(playTxtUrl + '?t=' + new Date().getTime());
      
      if (response.ok) {
        const text = await response.text();
        if (text.trim() !== "") {
          analysisContentEl.innerText = text;
          
          // Lấy giờ hiện tại làm mốc vừa cập nhật
          const now = new Date();
          const timeString = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
          const dateString = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
          
          timeTextEl.innerText = `Cập nhật lúc: ${timeString} (${dateString})`;
          statusDotEl.style.backgroundColor = "#22c55e";
          statusDotEl.style.boxShadow = "0 0 8px #22c55e";
        } else {
          analysisContentEl.innerHTML = `<div class="empty-text">[Máy chủ bận / File dữ liệu trống]</div>`;
          timeTextEl.innerText = `Trạng thái: Chưa có tin mới`;
          statusDotEl.style.backgroundColor = "#f59e0b";
          statusDotEl.style.boxShadow = "0 0 8px #f59e0b";
        }
      } else {
        analysisContentEl.innerHTML = `<div class="empty-text">[Máy chủ bận / Không thể lấy dữ liệu]</div>`;
        timeTextEl.innerText = `Trạng thái: Mất kết nối`;
        statusDotEl.style.backgroundColor = "#ef4444";
        statusDotEl.style.boxShadow = "0 0 8px #ef4444";
      }
    } catch (error) {
      analysisContentEl.innerHTML = `<div class="empty-text">[Máy chủ bận / Lỗi tải bản tin]</div>`;
      timeTextEl.innerText = `Trạng thái: Lỗi kết nối`;
      statusDotEl.style.backgroundColor = "#ef4444";
      statusDotEl.style.boxShadow = "0 0 8px #ef4444";
    }
  }

  function renderApp() {
    const tickerBoxEl = document.getElementById("tickerBox");
    const rainValEl = document.getElementById("rainVal");
    const humidityValEl = document.getElementById("humidityVal");
    const windValEl = document.getElementById("windVal");
    const mapContainerEl = document.getElementById("mapContainer");

    if (dataStore.hasData) {
      tickerBoxEl.innerText = `📢 ${dataStore.tickerText}`;
      rainValEl.innerText = dataStore.rain;
      humidityValEl.innerText = dataStore.humidity;
      windValEl.innerText = dataStore.wind;
      mapContainerEl.innerHTML = `<img src="${dataStore.imageUrl}" alt="Bản đồ dự báo">`;
    } else {
      tickerBoxEl.innerText = `⚠️ Chưa có thông báo mới`;
      rainValEl.innerText = "--";
      humidityValEl.innerText = "--";
      windValEl.innerText = "--";
      mapContainerEl.innerHTML = `<div class="empty-text">Chưa có hình ảnh bản đồ mới</div>`;
    }

    fetchPlayTxt();
  }

  renderApp();
</script>

</body>
</html>
