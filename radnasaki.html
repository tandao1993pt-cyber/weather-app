<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PTStormWatch - Phân Tích Thủ Công</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background-color: #080c14; 
      color: #f0f4f8; 
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .app-container { 
      width: 100%; 
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a 0%, #080c14 100%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    /* Header */
    .header { 
      text-align: center; 
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .location { 
      font-size: 24px; 
      font-weight: 800; 
      color: #ffffff; 
      letter-spacing: 0.5px;
    }
    .app-title { 
      font-size: 11px; 
      color: #38bdf8; 
      font-weight: 700; 
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .update-badge { 
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.7); 
      color: #38bdf8; 
      font-size: 11px; 
      padding: 4px 12px; 
      border-radius: 20px; 
      margin-top: 8px; 
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Băng thông báo ngắn */
    .ticker { 
      background: rgba(56, 189, 248, 0.08); 
      border-left: 4px solid #38bdf8; 
      padding: 10px 12px; 
      border-radius: 10px; 
      font-size: 13px; 
      color: #e2e8f0;
    }

    /* KHUNG DỰ BÁO THEO GIỜ KIỂU NHẬT (HOURLY TIMELINE) */
    .timeline-header {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timeline-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 8px 0;
      scrollbar-width: none;
    }
    .timeline-scroll::-webkit-scrollbar {
      display: none;
    }
    .hourly-card {
      min-width: 66px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      text-align: center;
      flex-shrink: 0;
    }
    .hourly-time { font-size: 11px; color: #cbd5e1; font-weight: 600; }
    .hourly-icon { font-size: 20px; margin: 2px 0; }
    .hourly-rain { font-size: 10px; color: #38bdf8; font-weight: 600; }
    .hourly-temp { font-size: 13px; font-weight: 700; color: #ffffff; }
    .hourly-wind { font-size: 10px; color: #94a3b8; }

    /* Ô hiển thị ảnh bản đồ */
    .map-box { 
      width: 100%;
      background: #020617; 
      border-radius: 18px; 
      overflow: hidden; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      min-height: 180px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .map-box img { 
      width: 100%; 
      height: auto; 
      display: block; 
      object-fit: cover; 
    }

    /* Ô Phân Tích Chuyên Sâu Kết Nối Play.txt */
    .analysis-box { 
      background: rgba(30, 41, 59, 0.5); 
      border-radius: 18px; 
      padding: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
    }
    .analysis-header { 
      font-size: 13px; 
      font-weight: 700; 
      color: #f59e0b; 
      margin-bottom: 10px; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    .analysis-content { 
      font-size: 13px; 
      color: #cbd5e1; 
      line-height: 1.6; 
      white-space: pre-line; 
    }

    .empty-text { text-align: center; color: #ef4444; padding: 12px 0; font-size: 13px; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <div class="location">Phan Thiết</div>
    <div class="app-title">PTSTORM WATCH • BẢN TIN THỦ CÔNG</div>
    <div id="updateTime" class="update-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="timeText">Đang kiểm tra...</span>
    </div>
  </div>

  <!-- Băng thông báo -->
  <div id="tickerBox" class="ticker">📢 Đang tải dữ liệu...</div>

  <!-- DỰ BÁO THEO KHUNG GIỜ STYLE NHẬT BẢN -->
  <div class="timeline-header">
    <span>Dự báo theo giờ</span>
    <span style="font-weight: normal; font-size: 11px;">Vuốt ngang ➔</span>
  </div>
  
  <div id="hourlyTimeline" class="timeline-scroll">
    <!-- Code sẽ tự tạo các ô giờ ở đây -->
  </div>

  <!-- Ô chứa ảnh bản đồ / Giản đồ -->
  <div id="mapContainer" class="map-box"></div>

  <!-- Ô Phân Tích Kết Nối Play.txt -->
  <div class="analysis-box">
    <div class="analysis-header">📝 Nhận Định Chuyên Sâu</div>
    <div id="analysisContent" class="analysis-content">Đang lấy dữ liệu từ Play.txt...</div>
  </div>
</div>

<script>
  const playTxtUrl = "https://raw.githubusercontent.com/tandao1993pt-cyber/weather-app/main/Play.txt";

  // Mẫu chuỗi thời tiết theo từng khung giờ (Kiểu Nhật)
  const hourlyData = [
    { time: "13:00", icon: "☀️", rain: "0 mm", temp: "31°C", wind: "12 km/h" },
    { time: "16:00", icon: "⛅", rain: "0 mm", temp: "30°C", wind: "15 km/h" },
    { time: "19:00", icon: "🌧️", rain: "2.5 mm", temp: "26°C", wind: "18 km/h" },
    { time: "22:00", icon: "🌧️", rain: "1.0 mm", temp: "25°C", wind: "14 km/h" },
    { time: "01:00", icon: "☁️", rain: "0 mm", temp: "24°C", wind: "10 km/h" },
    { time: "04:00", icon: "🌤️", rain: "0 mm", temp: "24°C", wind: "8 km/h" },
    { time: "07:00", icon: "☀️", rain: "0 mm", temp: "27°C", wind: "11 km/h" }
  ];

  const dataStore = {
    tickerText: "Mũi Né & Phan Thiết chiều tối có khả năng xuất hiện mưa dông cục bộ.",
    // Thay link ảnh hiển thị bản đồ của bạn vào đây:
    imageUrl: "https://i.postimg.cc/9F4sB168/sounding-example.png"
  };

  function renderHourlyCards() {
    const timelineEl = document.getElementById("hourlyTimeline");
    let html = "";
    hourlyData.forEach(item => {
      html += `
        <div class="hourly-card">
          <div class="hourly-time">${item.time}</div>
          <div class="hourly-icon">${item.icon}</div>
          <div class="hourly-rain">${item.rain}</div>
          <div class="hourly-temp">${item.temp}</div>
          <div class="hourly-wind">${item.wind}</div>
        </div>
      `;
    });
    timelineEl.innerHTML = html;
  }

  async function fetchPlayTxt() {
    const analysisContentEl = document.getElementById("analysisContent");
    const statusDotEl = document.getElementById("statusDot");
    const timeTextEl = document.getElementById("timeText");

    try {
      const response = await fetch(playTxtUrl + '?t=' + new Date().getTime());
      if (response.ok) {
        const text = await response.text();
        analysisContentEl.innerText = text.trim() !== "" ? text : "[File Play.txt chưa có nội dung]";
        
        const now = new Date();
        const timeString = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        const dateString = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
        
        timeTextEl.innerText = `Cập nhật: ${timeString} (${dateString})`;
        statusDotEl.style.backgroundColor = "#22c55e";
        statusDotEl.style.boxShadow = "0 0 8px #22c55e";
      } else {
        analysisContentEl.innerText = "[Lỗi kết nối tới file Play.txt]";
        statusDotEl.style.backgroundColor = "#ef4444";
      }
    } catch (e) {
      analysisContentEl.innerText = "[Lỗi nạp dữ liệu]";
      statusDotEl.style.backgroundColor = "#ef4444";
    }
  }

  function init() {
    document.getElementById("tickerBox").innerText = `📢 ${dataStore.tickerText}`;
    document.getElementById("mapContainer").innerHTML = `<img src="${dataStore.imageUrl}" alt="Bản đồ thời tiết" onerror="this.parentNode.innerHTML='<div class=\\'empty-text\\'>Chưa có ảnh bản đồ</div>'">`;
    renderHourlyCards();
    fetchPlayTxt();
  }

  init();
</script>

</body>
</html>
