<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嵐 STORM WATCH AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #212121;
    color: #ececec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 260px;
    background: #171717;
    border-right: 1px solid #303030;
    padding: 14px;
    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 8px 22px;
    font-weight: bold;
}

.logo-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #dc2626;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
}

.logo-text {
    font-size: 15px;
}

.new-chat {
    border: 1px solid #444;
    background: #242424;
    color: white;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
}

.new-chat:hover {
    background: #303030;
}

.sidebar-bottom {
    margin-top: auto;
    color: #888;
    font-size: 12px;
    padding: 10px;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid #303030;
    background: #212121;
}

.header-title {
    font-weight: bold;
}

.header-subtitle {
    color: #888;
    font-size: 12px;
    margin-left: 8px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 15%;
}

.message {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    line-height: 1.5;
    font-size: 15px;
}

.avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
}

.user-avatar {
    background: #444;
    color: #fff;
}

.ai-avatar {
    background: #dc2626;
    color: #ffffff;
}

.content {
    max-width: 850px;
    white-space: pre-wrap;
    word-break: break-word;
}

.user .content {
    background: #2d2d2d;
    color: #ffffff;
    padding: 10px 16px;
    border-radius: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 0.2px;
}

.input-area {
    padding: 15px 15%;
    background: linear-gradient(transparent, #212121 20%);
}

.input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #303030;
    border: 1px solid #555;
    border-radius: 18px;
    padding: 8px 10px 8px 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
}

.input-box:focus-within {
    border-color: #777;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    max-height: 130px;
    padding: 8px 0;
}

textarea::placeholder {
    color: #aaa;
}

button {
    border: none;
    cursor: pointer;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: transparent;
    color: #ccc;
    font-size: 18px;
}

.icon-btn:hover {
    background: #444;
}

.send-btn {
    background: white;
    color: black;
}

.send-btn:hover {
    background: #ddd;
}

.recording {
    color: #ff453a;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% { transform: scale(1.15); }
}

.speaking {
    margin-top: 10px;
}

.big-speak-btn {
    background: #dc2626;
    color: #ffffff;
    font-weight: bold;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
}

.big-speak-btn:active {
    transform: scale(0.96);
}

@media (max-width: 700px) {
    .sidebar { display: none; }
    .chat { padding: 20px 12px; }
    .input-area { padding: 10px; }
    .header-subtitle { display: none; }
}
</style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">嵐</div>
            <div class="logo-text">STORM WATCH AI</div>
        </div>
        <button class="new-chat" onclick="newChat()">＋ Cuộc trò chuyện mới</button>
        <div class="sidebar-bottom">
            嵐 Storm Watch AI<br>Trợ lý thực địa Phan Thiết
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <span class="header-title">Storm Watch AI</span>
            <span class="header-subtitle">Trợ lý dông lốc Phan Thiết</span>
        </header>

        <section class="chat" id="chat">
            <div class="message assistant">
                <div class="avatar ai-avatar">嵐</div>
                <div class="content">Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin gì hôm nay?
                    <div class="speaking">
                        <button class="big-speak-btn" onclick="speakText('Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin gì hôm nay?', this)">🔊 Bấm để nghe</button>
                    </div>
                </div>
            </div>
        </section>

        <div class="input-area">
            <div class="input-box">
                <button id="micBtn" class="icon-btn" onclick="toggleVoice()" title="Nói">🎙️</button>
                <textarea id="input" rows="1" placeholder="Nhắn tin cho Storm Watch AI..." onkeydown="handleKey(event)"></textarea>
                <button class="icon-btn send-btn" onclick="sendMessage()" title="Gửi">↑</button>
            </div>
        </div>
    </main>
</div>

<script>
const API_KEY = "AQ.Ab8RN6JUtmhcOh8UHTSXfJKPzS8XUu2nhdY1Sgz98pbjbL8n2w";
const MODEL = "gemini-3.7-flash";
const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

const SYSTEM_INSTRUCTION = "Bạn là trợ lý Storm Watch AI. Hãy trả lời bằng tiếng Việt phổ thông chuẩn xác, rõ ràng, lịch sự và tự nhiên. Câu trả lời phải ngắn gọn dưới 2 câu. Tuyệt đối KHÔNG dùng từ lóng hay từ địa phương như tui, nghen, nè, hồng biết. KHÔNG dùng dấu sao (*), gạch đầu dòng hay ký tự đặc biệt.";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");
let currentAudio = null;

async function fetchWithRetry(url, payload, maxRetries = 2, delayMs = 1500) {
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (response.ok) return { ok: true, data };
            
            const errMsg = data.error?.message || "";
            if ((errMsg.includes("high demand") || response.status === 429) && attempt < maxRetries) {
                await new Promise(res => setTimeout(res, delayMs * (attempt + 1)));
                continue;
            }
            return { ok: false, data };
        } catch (err) {
            if (attempt === maxRetries) throw err;
            await new Promise(res => setTimeout(res, delayMs * (attempt + 1)));
        }
    }
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = "";
    autoResize();

    const loading = addAIMessage("Đang suy nghĩ...");

    try {
        const payload = {
            system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: text }] }]
        };

        const result = await fetchWithRetry(API_URL, payload);
        loading.remove();

        if (!result.ok) {
            addAIMessage("Có lỗi kết nối. Bạn bấm gửi lại giúp tôi nhé.");
            return;
        }

        let reply = result.data.candidates?.[0]?.content?.parts?.[0]?.text || "Chưa nhận được câu trả lời.";
        reply = reply.replace(/[*#_~`]/g, '');

        addAIMessage(reply);

    } catch (error) {
        loading.remove();
        addAIMessage("Không có kết nối mạng. Bạn kiểm tra lại mạng nhé.");
    }
}

function addUserMessage(text) {
    const message = document.createElement("div");
    message.className = "message user";
    message.innerHTML = `<div class="avatar user-avatar">👤</div><div class="content"></div>`;
    message.querySelector(".content").textContent = text;
    chat.appendChild(message);
    scrollBottom();
}

function addAIMessage(text) {
    const message = document.createElement("div");
    message.className = "message assistant";

    const avatar = document.createElement("div");
    avatar.className = "avatar ai-avatar";
    avatar.textContent = "嵐";

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;

    if (text !== "Đang suy nghĩ...") {
        const controls = document.createElement("div");
        controls.className = "speaking";

        const speak = document.createElement("button");
        speak.className = "big-speak-btn";
        speak.innerHTML = "🔊 Bấm để nghe";
        speak.onclick = () => speakText(text, speak);

        controls.appendChild(speak);
        content.appendChild(controls);
    }

    message.appendChild(avatar);
    message.appendChild(content);
    chat.appendChild(message);

    scrollBottom();
    return message;
}

async function speakText(text, button) {
    if (!text) return;

    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }

    const cleanText = text.replace(/[*#_~`]/g, '').trim().substring(0, 150);
    if (button) button.innerHTML = "⏳ Đang tải...";

    try {
        const res = await fetch("https://api.soundoftext.com/sounds", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                engine: "Google",
                data: { text: cleanText, voice: "vi-VN" }
            })
        });

        const data = await res.json();

        if (data.success && data.id) {
            const audioUrl = `https://files.soundoftext.com/${data.id}.mp3`;
            currentAudio = new Audio(audioUrl);

            if (button) button.innerHTML = "🔊 Đang đọc...";

            currentAudio.play().catch(() => {
                if (button) button.innerHTML = "🔊 Bấm để nghe lại";
            });

            currentAudio.onended = () => {
                if (button) button.innerHTML = "🔊 Bấm để nghe lại";
            };
            currentAudio.onerror = () => {
                if (button) button.innerHTML = "🔊 Bấm để nghe lại";
            };
        } else {
            if (button) button.innerHTML = "🔊 Bấm để nghe lại";
        }
    } catch (e) {
        if (button) button.innerHTML = "🔊 Bấm để nghe lại";
    }
}

let recognition = null;
let isRecording = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "vi-VN";
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "🔴";
    };

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
        autoResize();
    };

    recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎙️";
    };

    recognition.onerror = () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎙️";
    };
}

function toggleVoice() {
    if (!recognition) {
        alert("Chưa bật micro.");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        recognition.start();
    }
}

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

input.addEventListener("input", autoResize);
function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
}

function newChat() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    chat.innerHTML = `
        <div class="message assistant">
            <div class="avatar ai-avatar">嵐</div>
            <div class="content">Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin gì hôm nay?
                <div class="speaking">
                    <button class="big-speak-btn" onclick="speakText('Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin gì hôm nay?', this)">🔊 Bấm để nghe</button>
                </div>
            </div>
        </div>
    `;
}

function scrollBottom() {
    setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}
</script>

</body>
  </html>
