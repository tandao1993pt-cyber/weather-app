<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嵐 STORM WATCH AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    margin: 0;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
    width: 100vw;
}

/* Sidebar phong cách Glassmorphism */
.sidebar {
    width: 260px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    padding: 16px;
    display: flex;
    flex-direction: column;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 8px 20px;
    font-weight: bold;
}

.logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #ef4444;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
}

.logo-text {
    font-size: 15px;
    color: #f8fafc;
    letter-spacing: 0.5px;
}

.new-chat {
    border: 1px solid rgba(56, 189, 248, 0.3);
    background: rgba(56, 189, 248, 0.1);
    color: #38bdf8;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.new-chat:hover {
    background: rgba(56, 189, 248, 0.2);
    border-color: rgba(56, 189, 248, 0.5);
}

.sidebar-bottom {
    margin-top: auto;
    color: #64748b;
    font-size: 12px;
    padding: 10px 4px;
    line-height: 1.5;
}

/* Main Content Area */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent 40%);
}

.header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
}

.header-title {
    font-weight: bold;
    font-size: 16px;
    color: #f8fafc;
}

.header-subtitle {
    color: #94a3b8;
    font-size: 12px;
    margin-left: 10px;
}

/* Khung Chat */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 15%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.message {
    display: flex;
    gap: 14px;
    line-height: 1.6;
    font-size: 14px;
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
}

.avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
}

.user-avatar {
    background: #0284c7;
    color: #ffffff;
}

.ai-avatar {
    background: #ef4444;
    color: #ffffff;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
}

.content {
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 100%;
}

.assistant .content {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(10px);
    color: #f1f5f9;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top-left-radius: 4px;
}

.user .content {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: #ffffff;
    padding: 12px 16px;
    border-radius: 16px;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
}

/* Khung Nhập Liệu & Gợi Ý */
.input-area {
    padding: 12px 15% 20px;
    background: linear-gradient(transparent, #0f172a 30%);
}

.quick-prompts {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 10px;
    max-width: 850px;
    margin: 0 auto;
}

.prompt-chip {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.2);
    color: #38bdf8;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s;
}

.prompt-chip:hover {
    background: rgba(56, 189, 248, 0.25);
}

.input-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 8px 12px 8px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    max-width: 850px;
    margin: 0 auto;
}

.input-box:focus-within {
    border-color: rgba(56, 189, 248, 0.5);
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    max-height: 120px;
    padding: 6px 0;
}

textarea::placeholder {
    color: #64748b;
}

button {
    border: none;
    cursor: pointer;
}

.icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    color: #38bdf8;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-btn:hover {
    background: rgba(255, 255, 255, 0.08);
}

.send-btn {
    background: #38bdf8;
    color: #0f172a;
    font-weight: bold;
    border-radius: 12px;
    width: 36px;
    height: 36px;
}

.send-btn:hover {
    background: #0284c7;
    color: #ffffff;
}

.recording {
    color: #ef4444;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% { transform: scale(1.15); }
}

.speaking {
    margin-top: 10px;
}

.big-speak-btn {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
    font-weight: 600;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
}

.big-speak-btn:hover {
    background: rgba(239, 68, 68, 0.3);
}

.big-speak-btn:active {
    transform: scale(0.96);
}

@media (max-width: 768px) {
    .chat { padding: 16px 12px; }
    .input-area { padding: 10px 12px 16px; }
    .header-subtitle { display: none; }
}
</style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">嵐</div>
            <div class="logo-text">STORM WATCH AI</div>
        </div>
        <button class="new-chat" onclick="newChat()">＋ Cuộc trò chuyện mới</button>
        <div class="sidebar-bottom">
            嵐 Storm Watch AI<br>Trợ lý thực địa Phan Thiết
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <span class="header-title">Storm Watch AI</span>
            <span class="header-subtitle">Trợ lý dông lốc Phan Thiết</span>
        </header>

        <section class="chat" id="chat">
            <div class="message assistant">
                <div class="avatar ai-avatar">嵐</div>
                <div class="content">Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?
                    <div class="speaking">
                        <button class="big-speak-btn" onclick="speakText('Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?', this)">🔊 Bấm để nghe</button>
                    </div>
                </div>
            </div>
        </section>

        <div class="input-area">
            <div class="quick-prompts">
                <div class="prompt-chip" onclick="sendQuickPrompt('Thời tiết Phan Thiết hiện tại sao rồi?')">🌧 Thời tiết hiện tại</div>
                <div class="prompt-chip" onclick="sendQuickPrompt('Hôm nay Mũi Né gió có mạnh không?')">💨 Gió Mũi Né</div>
                <div class="prompt-chip" onclick="sendQuickPrompt('Tối nay có nguy cơ mưa dông không?')">⚡ Cảnh báo dông lốc</div>
            </div>
            <div class="input-box">
                <button id="micBtn" class="icon-btn" onclick="toggleVoice()" title="Nói">🎙️</button>
                <textarea id="input" rows="1" placeholder="Nhắn tin cho Storm Watch AI..." onkeydown="handleKey(event)"></textarea>
                <button class="icon-btn send-btn" onclick="sendMessage()" title="Gửi">↑</button>
            </div>
        </div>
    </main>
</div>

<script>
const API_KEY = "AQ.Ab8RN6JUtmhcOh8UHTSXfJKPzS8XUu2nhdY1Sgz98pbjbL8n2w";
const MODEL = "gemini-3.7-flash";
const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

const SYSTEM_INSTRUCTION = "Bạn là trợ lý Storm Watch AI. Hãy trả lời bằng tiếng Việt phổ thông chuẩn xác, rõ ràng, lịch sự và tự nhiên. Câu trả lời phải ngắn gọn dưới 2 câu. Tuyệt đối KHÔNG dùng từ lóng hay từ địa phương như tui, nghen, nè, hồng biết. KHÔNG dùng dấu sao (*), gạch đầu dòng hay ký tự đặc biệt.";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");
let currentAudio = null;

async function fetchWithRetry(url, payload, maxRetries = 2, delayMs = 1500) {
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (response.ok) return { ok: true, data };
            
            const errMsg = data.error?.message || "";
            if ((errMsg.includes("high demand") || response.status === 429) && attempt < maxRetries) {
                await new Promise(res => setTimeout(res, delayMs * (attempt + 1)));
                continue;
            }
            return { ok: false, data };
        } catch (err) {
            if (attempt === maxRetries) throw err;
            await new Promise(res => setTimeout(res, delayMs * (attempt + 1)));
        }
    }
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = "";
    autoResize();

    const loading = addAIMessage("Đang suy nghĩ...");

    try {
        const payload = {
            system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: text }] }]
        };

        const result = await fetchWithRetry(API_URL, payload);
        loading.remove();

        if (!result.ok) {
            addAIMessage("Có lỗi kết nối. Bạn bấm gửi lại giúp tôi nhé.");
            return;
        }

        let reply = result.data.candidates?.[0]?.content?.parts?.[0]?.text || "Chưa nhận được câu trả lời.";
        reply = reply.replace(/[*#_~`]/g, '');

        addAIMessage(reply);

    } catch (error) {
        loading.remove();
        addAIMessage("Không có kết nối mạng. Bạn kiểm tra lại mạng nhé.");
    }
}

function sendQuickPrompt(promptText) {
    input.value = promptText;
    sendMessage();
}

function addUserMessage(text) {
    const message = document.createElement("div");
    message.className = "message user";
    message.innerHTML = `<div class="avatar user-avatar">👤</div><div class="content"></div>`;
    message.querySelector(".content").textContent = text;
    chat.appendChild(message);
    scrollBottom();
}

function addAIMessage(text) {
    const message = document.createElement("div");
    message.className = "message assistant";

    const avatar = document.createElement("div");
    avatar.className = "avatar ai-avatar";
    avatar.textContent = "嵐";

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;

    if (text !== "Đang suy nghĩ...") {
        const controls = document.createElement("div");
        controls.className = "speaking";

        const speak = document.createElement("button");
        speak.className = "big-speak-btn";
        speak.innerHTML = "🔊 Bấm để nghe";
        speak.onclick = () => speakText(text, speak);

        controls.appendChild(speak);
        content.appendChild(controls);
    }

    message.appendChild(avatar);
    message.appendChild(content);
    chat.appendChild(message);

    scrollBottom();
    return message;
}

async function speakText(text, button) {
    if (!text) return;

    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }

    const cleanText = text.replace(/[*#_~`]/g, '').trim().substring(0, 150);
    if (button) button.innerHTML = "⏳ Đang tải...";

    try {
        const res = await fetch("https://api.soundoftext.com/sounds", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                engine: "Google",
                data: { text: cleanText, voice: "vi-VN" }
            })
        });

        const data = await res.json();

        if (data.success && data.id) {
            const audioUrl = `https://files.soundoftext.com/${data.id}.mp3`;
            currentAudio = new Audio(audioUrl);

            if (button) button.innerHTML = "🔊 Đang đọc...";

            currentAudio.play().catch(() => {
                if (button) button.innerHTML = "🔊 Bấm để nghe lại";
            });

            currentAudio.onended = () => {
                if (button) button.innerHTML = "🔊 Bấm để nghe lại";
            };
            currentAudio.onerror = () => {
                if (button) button.innerHTML = "🔊 Bấm để nghe lại";
            };
        } else {
            if (button) button.innerHTML = "🔊 Bấm để nghe lại";
        }
    } catch (e) {
        if (button) button.innerHTML = "🔊 Bấm để nghe lại";
    }
}

let recognition = null;
let isRecording = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "vi-VN";
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "🔴";
    };

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
        autoResize();
    };

    recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎙️";
    };

    recognition.onerror = () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎙️";
    };
}

function toggleVoice() {
    if (!recognition) {
        alert("Thiết bị hoặc trình duyệt chưa hỗ trợ micro web.");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        recognition.start();
    }
}

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

input.addEventListener("input", autoResize);
function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
}

function newChat() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    chat.innerHTML = `
        <div class="message assistant">
            <div class="avatar ai-avatar">嵐</div>
            <div class="content">Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?
                <div class="speaking">
                    <button class="big-speak-btn" onclick="speakText('Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?', this)">🔊 Bấm để nghe</button>
                </div>
            </div>
        </div>
    `;
}

function scrollBottom() {
    setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}
</script>

</body>
</html>
