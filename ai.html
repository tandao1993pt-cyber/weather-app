<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Storm Watch AI - Professional</title>
    
    <!-- CSS - Tách biệt và quy hoạch rõ ràng -->
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #1e293b;
            --header-bg: rgba(15, 23, 42, 0.9);
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER SECTION */
        .header { 
            height: 60px; padding: 0 20px; display: flex; align-items: center; 
            background: var(--header-bg); backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--border-color); z-index: 50;
        }
        .menu-btn { cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 10px; }
        .menu-btn div { width: 22px; height: 2px; background: var(--text-main); border-radius: 2px; }
        .app-name { font-weight: 700; font-size: 18px; color: var(--accent); margin-left: 15px; letter-spacing: 0.5px; }

        /* SIDEBAR SECTION (Giữ sạch sẽ) */
        #sidebar { 
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%; 
            background: var(--panel-bg); transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); 
            z-index: 100; box-shadow: 5px 0 20px rgba(0,0,0,0.5); padding: 20px;
        }
        #sidebar.open { left: 0; }
        .sidebar-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); display: none; z-index: 99;
        }
        .sidebar-overlay.open { display: block; }
        
        /* Nút chấm than duy nhất */
        .sidebar-content { display: flex; align-items: center; justify-content: center; margin-top: 50px; }
        .circle-icon { 
            width: 60px; height: 60px; border: 2px solid var(--accent); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            color: var(--accent); font-size: 28px; cursor: pointer; transition: 0.3s;
        }
        .circle-icon:hover { background: var(--accent); color: var(--bg-color); }

        /* CHAT INTERFACE */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; max-width: 85%; }
        .message.assistant { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 12px 18px; line-height: 1.5; font-size: 15px; }
        .assistant .bubble { background: var(--panel-bg); border-radius: 18px 18px 18px 4px; border: 1px solid var(--border-color); }
        .user .bubble { background: var(--accent); color: var(--bg-color); border-radius: 18px 18px 4px 18px; font-weight: 500; }

        /* INPUT AREA */
        .input-area { padding: 20px; background: var(--header-bg); border-top: 1px solid var(--border-color); }
        .input-wrapper { display: flex; align-items: center; background: var(--panel-bg); border-radius: 30px; padding: 5px 15px; border: 1px solid var(--border-color); }
        #message-input { flex: 1; border: none; background: transparent; color: white; padding: 12px; outline: none; }
        .send-btn { background: var(--accent); border: none; padding: 8px 18px; border-radius: 20px; color: var(--bg-color); font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Overlay cho sidebar -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Header -->
    <header class="header">
        <div class="menu-btn" onclick="toggleSidebar()">
            <div></div><div></div><div></div>
        </div>
        <div class="app-name">Storm Watch AI</div>
    </header>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-content">
            <div class="circle-icon">!</div>
        </div>
    </div>

    <!-- Main Chat -->
    <main class="chat-container" id="chat-box">
        <div class="message assistant">
            <div class="bubble">Hệ thống đã khởi động. Tôi có thể giúp gì cho ông hôm nay?</div>
        </div>
    </main>

    <!-- Footer Input -->
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="message-input" placeholder="Nhập câu hỏi tại đây...">
            <button class="send-btn" onclick="processMessage()">Gửi</button>
        </div>
    </div>

    <!-- JAVASCRIPT - Cấu trúc lại để dễ bảo trì -->
    <script>
        // 1. Cấu hình API
        const CONFIG = {
            apiKey: "AQ.Ab8RN6JUtmhcOh8UHTSXfJKPzS8XUu2nhdY1Sgz98pbjbL8n2w",
            model: "gemini-1.5-flash",
            baseUrl: "https://generativelanguage.googleapis.com/v1beta/models/"
        };

        // 2. DOM Elements
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.querySelector('.sidebar-overlay');

        // 3. UI Functions
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div class="bubble">${text}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 4. API Logic
        async function processMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            messageInput.value = "";

            try {
                const response = await fetch(`${CONFIG.baseUrl}${CONFIG.model}:generateContent?key=${CONFIG.apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessage(reply.replace(/[*#_~`]/g, ''), 'assistant');
                } else {
                    throw new Error("Dữ liệu phản hồi không hợp lệ");
                }
            } catch (error) {
                console.error("Lỗi:", error);
                appendMessage("Kết nối không ổn định. Vui lòng kiểm tra lại.", 'assistant');
            }
        }

        // Hỗ trợ nhấn Enter
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") processMessage();
        });
    </script>
</body>
</html>
