<script>
/*

QUAN TRỌNG:
1. Không dùng lại API key cũ đã bị lộ.
2. Tạo API key mới rồi đặt vào GEMINI_API_KEY bên dưới.
3. Không chia sẻ file HTML sau khi đã điền key thật.
========================================================
*/

const GEMINI_API_KEY = "AQ.Ab8RN6IJc2DleceWyflzUprdORY8cLy903N1QR7yxw0GygJ-BQ;

// Model Gemini hiện tại
const GEMINI_MODEL = "gemini-3.6-flash";

// Endpoint Gemini chính thức
const API_URL =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    GEMINI_MODEL +
    ":generateContent";


const SYSTEM_INSTRUCTION =
    "Bạn là trợ lý Storm Watch AI. " +
    "Hãy trả lời bằng tiếng Việt phổ thông chuẩn xác, rõ ràng, lịch sự và tự nhiên. " +
    "Câu trả lời phải ngắn gọn dưới 2 câu. " +
    "Tuyệt đối KHÔNG dùng từ lóng hay từ địa phương như tui, nghen, nè, hồng biết. " +
    "KHÔNG dùng dấu sao (*), gạch đầu dòng hay ký tự đặc biệt.";


const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");

let currentAudio = null;


/* Hiệu ứng avatar */
setInterval(() => {
    const avatars = document.querySelectorAll(".ai-avatar");

    avatars.forEach(avatar => {
        avatar.classList.add("flashing-effect");

        setTimeout(() => {
            avatar.classList.remove("flashing-effect");
        }, 2000);
    });
}, 15000);


/* Menu */
function toggleMenu() {
    document.getElementById("drawerOverlay").classList.toggle("active");
}


/* ======================================================
   GỌI GEMINI
====================================================== */

async function fetchWithRetry(payload, maxRetries = 1, delayMs = 1500) {

    for (let attempt = 0; attempt <= maxRetries; attempt++) {

        try {

            const response = await fetch(API_URL, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": GEMINI_API_KEY
                },

                body: JSON.stringify(payload)
            });


            const data = await response.json();


            if (response.ok) {
                return {
                    ok: true,
                    data: data
                };
            }


            if (
                attempt < maxRetries &&
                (response.status === 429 || response.status >= 500)
            ) {

                await new Promise(resolve =>
                    setTimeout(resolve, delayMs)
                );

                continue;
            }


            return {
                ok: false,
                data: data,
                status: response.status
            };

        } catch (error) {

            if (attempt === maxRetries) {
                throw error;
            }

            await new Promise(resolve =>
                setTimeout(resolve, delayMs)
            );
        }
    }
}


/* ======================================================
   GỬI TIN NHẮN
====================================================== */

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;


    /* Hiển thị tin nhắn người dùng */
    addUserMessage(text);

    input.value = "";

    autoResize();


    /* Hiển thị trạng thái */
    const loading = addAIMessage("Đang suy nghĩ...");


    try {

        /*
        Cấu trúc generateContent chính thức của Gemini
        */

        const payload = {

            systemInstruction: {
                parts: [
                    {
                        text: SYSTEM_INSTRUCTION
                    }
                ]
            },

            contents: [
                {
                    role: "user",
                    parts: [
                        {
                            text: text
                        }
                    ]
                }
            ]

        };


        const result = await fetchWithRetry(payload);


        loading.remove();


        if (!result.ok) {

            const errorMsg =
                result.data?.error?.message ||
                "Lỗi phản hồi từ Google Gemini";

            console.error("Gemini API Error:", result.data);

            addAIMessage(
                "Không thể kết nối Gemini. Chi tiết lỗi: " +
                errorMsg
            );

            return;
        }


        /*
        Lấy câu trả lời từ Gemini
        */

        let reply =
            result.data?.candidates?.[0]?.content?.parts?.[0]?.text ||
            "Chưa nhận được câu trả lời.";


        /*
        Làm sạch một số ký tự định dạng
        */

        reply = reply.replace(/[*#_~`]/g, "").trim();


        addAIMessage(reply);


    } catch (error) {

        console.error("Network error:", error);

        loading.remove();

        addAIMessage(
            "Lỗi mạng internet. Bạn kiểm tra lại kết nối Wifi/4G nhé."
        );
    }
}


/* ======================================================
   CÂU HỎI NHANH
====================================================== */

function sendQuickPrompt(promptText) {

    input.value = promptText;

    sendMessage();
}


/* ======================================================
   TIN NHẮN USER
====================================================== */

function addUserMessage(text) {

    const message = document.createElement("div");

    message.className = "message user";

    message.innerHTML =
        '<div class="user-avatar">👤</div>' +
        '<div class="content-bubble"></div>';


    message.querySelector(".content-bubble").textContent = text;

    chat.appendChild(message);

    scrollBottom();
}


/* ======================================================
   TIN NHẮN AI
====================================================== */

function addAIMessage(text) {

    const message = document.createElement("div");

    message.className = "message assistant";


    const avatar = document.createElement("div");

    avatar.className = "ai-avatar";

    avatar.textContent = "嵐";


    const content = document.createElement("div");

    content.className = "content-bubble";

    content.textContent = text;


    if (text !== "Đang suy nghĩ...") {

        const controls = document.createElement("div");

        controls.className = "speaking-box";


        const speak = document.createElement("button");

        speak.className = "speak-btn";

        speak.innerHTML = "🔊 Bấm để nghe";


        speak.onclick = () =>
            speakText(text, speak);


        controls.appendChild(speak);

        content.appendChild(controls);
    }


    message.appendChild(avatar);

    message.appendChild(content);

    chat.appendChild(message);


    scrollBottom();


    return message;
}


/* ======================================================
   GIỌNG NÓI AI
   GIỮ NGUYÊN HỆ THỐNG CŨ
====================================================== */

async function speakText(text, button) {

    if (!text) return;


    if (currentAudio) {

        currentAudio.pause();

        currentAudio = null;
    }


    const cleanText =
        text
            .replace(/[*#_~`]/g, "")
            .trim()
            .substring(0, 150);


    if (button) {
        button.innerHTML = "⏳ Đang tải...";
    }


    try {

        const res = await fetch(
            "https://api.soundoftext.com/sounds",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    engine: "Google",

                    data: {
                        text: cleanText,
                        voice: "vi-VN"
                    }
                })
            }
        );


        const data = await res.json();


        if (data.success && data.id) {

            const audioUrl =
                "https://files.soundoftext.com/" +
                data.id +
                ".mp3";


            currentAudio = new Audio(audioUrl);


            if (button) {
                button.innerHTML = "🔊 Đang đọc...";
            }


            currentAudio.play().catch(() => {

                if (button) {
                    button.innerHTML =
                        "🔊 Bấm để nghe lại";
                }
            });


            currentAudio.onended = () => {

                if (button) {
                    button.innerHTML =
                        "🔊 Bấm để nghe lại";
                }
            };


            currentAudio.onerror = () => {

                if (button) {
                    button.innerHTML =
                        "🔊 Bấm để nghe lại";
                }
            };

        } else {

            if (button) {
                button.innerHTML =
                    "🔊 Bấm để nghe lại";
            }
        }

    } catch (e) {

        if (button) {
            button.innerHTML =
                "🔊 Bấm để nghe lại";
        }
    }
}


/* ======================================================
   MICROPHONE
   GIỮ NGUYÊN
====================================================== */

let recognition = null;

let isRecording = false;


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "vi-VN";

    recognition.continuous = false;

    recognition.interimResults = true;


    recognition.onstart = () => {

        isRecording = true;

        micBtn.classList.add("recording");

        micBtn.textContent = "🔴";
    };


    recognition.onresult = (event) => {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            transcript +=
                event.results[i][0].transcript;
        }


        input.value = transcript;

        autoResize();
    };


    recognition.onend = () => {

        isRecording = false;

        micBtn.classList.remove("recording");

        micBtn.textContent = "🎙️";
    };


    recognition.onerror = () => {

        isRecording = false;

        micBtn.classList.remove("recording");

        micBtn.textContent = "🎙️";
    };
}


function toggleVoice() {

    if (!recognition) {

        alert(
            "Thiết bị hoặc trình duyệt chưa hỗ trợ micro web."
        );

        return;
    }


    if (isRecording) {

        recognition.stop();

    } else {

        recognition.start();
    }
}


/* ======================================================
   ENTER GỬI
====================================================== */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* ======================================================
   AUTO RESIZE
====================================================== */

input.addEventListener("input", autoResize);


function autoResize() {

    input.style.height = "auto";

    input.style.height =
        Math.min(input.scrollHeight, 100) + "px";
}


/* ======================================================
   CHAT MỚI
====================================================== */

function newChat() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio = null;
    }


    chat.innerHTML =
        '<div class="message assistant">' +
            '<div class="ai-avatar">嵐</div>' +
            '<div class="content-bubble">' +
                'Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?' +
                '<div class="speaking-box">' +
                    '<button class="speak-btn" onclick="speakText(\'Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?\', this)">' +
                        '🔊 Bấm để nghe' +
                    '</button>' +
                '</div>' +
            '</div>' +
        '</div>';
}


/* ======================================================
   CUỘN XUỐNG
====================================================== */

function scrollBottom() {

    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    }, 50);
}
                </script>
