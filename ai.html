<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Storm Watch AI 嵐</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #0f172a;
    color: #f1f5f9;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Header */
.header {
    height: 60px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    z-index: 20;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #f8fafc;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
}

.header-btn:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.15);
}

.title-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 189, 248, 0.1);
    padding: 6px 14px;
    border-radius: 30px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    font-weight: 700;
    font-size: 14px;
    color: #38bdf8;
    letter-spacing: 0.3px;
}

/* Menu */
.drawer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.drawer-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.drawer {
    position: fixed;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100vh;
    background: #1e293b;
    z-index: 101;
    padding: 24px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.drawer-overlay.active .drawer {
    transform: translateX(280px);
}

.circle-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    color: #38bdf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    cursor: pointer;
}

/* Khung Chat */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 100px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
}

.message {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    max-width: 90%;
    animation: bubblePop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes bubblePop {
    0% { opacity: 0; transform: translateY(16px) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.ai-avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    animation: pulseAvatar 2.5s infinite ease-in-out;
}

@keyframes pulseAvatar {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }
    50% {
        transform: scale(1.08);
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    }
}

.user-avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
}

.content-bubble {
    padding: 14px 18px;
    font-size: 14.5px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.assistant .content-bubble {
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #f8fafc;
    border-radius: 24px 24px 24px 6px;
}

.user .content-bubble {
    background: linear-gradient(135deg, #0284c7, #0ea5e9);
    color: #ffffff;
    border-radius: 22px 22px 6px 22px;
    font-weight: 400;
    letter-spacing: 0.2px;
}

.speaking-box {
    margin-top: 8px;
}

.speak-btn {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
    font-weight: 600;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}

.speak-btn:active {
    transform: scale(0.95);
}

/* Khung Nhập Liệu */
.input-wrapper {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100vw;
    padding: 10px 14px 16px;
    background: linear-gradient(to top, #0f172a 70%, transparent);
    z-index: 20;
}

.quick-prompts {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
}

.quick-prompts::-webkit-scrollbar { display: none; }

.prompt-chip {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(56, 189, 248, 0.25);
    color: #38bdf8;
    padding: 8px 16px;
    border-radius: 25px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
}

.prompt-chip:active {
    background: rgba(56, 189, 248, 0.2);
}

.input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(30, 41, 59, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    padding: 6px 8px 6px 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: #ffffff;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 100px;
    padding: 6px 0;
    font-family: inherit;
}

textarea::placeholder { color: #64748b; }

.action-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s;
}

.action-btn:active { transform: scale(0.9); }

.mic-btn {
    background: transparent;
    color: #38bdf8;
}

.mic-btn.recording {
    color: #ef4444;
    animation: pulseMic 1s infinite;
}

@keyframes pulseMic {
    50% { transform: scale(1.2); }
}

.send-btn {
    background: #38bdf8;
    color: #0f172a;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()">
    <div class="drawer" onclick="event.stopPropagation()">
        <div class="circle-icon">!</div>
    </div>
</div>

<header class="header">
    <div class="header-left">
        <button class="header-btn" onclick="toggleMenu()">☰</button>
        <div class="title-pill">
            <span>嵐</span> Storm Watch AI
        </div>
    </div>
    <button class="header-btn" onclick="newChat()">＋</button>
</header>

<main class="chat" id="chat">
    <div class="message assistant">
        <div class="ai-avatar">嵐</div>
        <div class="content-bubble">
            Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?
            <div class="speaking-box">
                <button class="speak-btn" onclick="speakText('Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?', this)">🔊 Bấm để nghe</button>
            </div>
        </div>
    </div>
</main>

<div class="input-wrapper">
    <div class="quick-prompts">
        <div class="prompt-chip" onclick="sendQuickPrompt('Thời tiết Phan Thiết hiện tại sao rồi?')">🌧 Thời tiết hiện tại</div>
        <div class="prompt-chip" onclick="sendQuickPrompt('Hôm nay Mũi Né gió có mạnh không?')">💨 Gió Mũi Né</div>
        <div class="prompt-chip" onclick="sendQuickPrompt('Tối nay có nguy cơ mưa dông không?')">⚡ Cảnh báo dông lốc</div>
    </div>
    <div class="input-box">
        <button id="micBtn" class="action-btn mic-btn" onclick="toggleVoice()" title="Nói">🎙️</button>
        <textarea id="input" rows="1" placeholder="Nhắn tin cho Storm Watch AI..." onkeydown="handleKey(event)"></textarea>
        <button class="action-btn send-btn" onclick="sendMessage()" title="Gửi">↑</button>
    </div>
</div>

<script>
const API_KEY = "DÁN_MÃ_AIzaSy_CỦA_ÔNG_VÀO_ĐÂY";
const MODEL = "gemini-2.0-flash"
const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

const SYSTEM_INSTRUCTION = "Bạn là trợ lý Storm Watch AI. Hãy trả lời bằng tiếng Việt phổ thông chuẩn xác, rõ ràng, lịch sự và tự nhiên. Câu trả lời phải ngắn gọn dưới 2 câu. Tuyệt đối KHÔNG dùng từ lóng hay từ địa phương như tui, nghen, nè, hồng biết. KHÔNG dùng dấu sao (*), gạch đầu dòng hay ký tự đặc biệt.";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("micBtn");

function toggleMenu() {
    document.getElementById("drawerOverlay").classList.toggle("active");
}

async function fetchWithRetry(url, payload, maxRetries = 1, delayMs = 1500) {
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "x-goog-api-key": API_KEY
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (response.ok) return { ok: true, data };
            
            if (attempt < maxRetries && response.status === 429) {
                await new Promise(res => setTimeout(res, delayMs));
                continue;
            }
            return { ok: false, data, status: response.status };
        } catch (err) {
            if (attempt === maxRetries) throw err;
            await new Promise(res => setTimeout(res, delayMs));
        }
    }
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = "";
    autoResize();

    const loading = addAIMessage("Đang suy nghĩ...");

    try {
        const payload = {
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: [{ parts: [{ text: text }] }]
        };

        const result = await fetchWithRetry(API_URL, payload);
        loading.remove();

        if (!result.ok) {
            const errorMsg = result.data?.error?.message || "Lỗi phản hồi từ Google";
            addAIMessage(`Không thể kết nối. Chi tiết lỗi: ${errorMsg}`);
            return;
        }

        let reply = result.data.candidates?.[0]?.content?.parts?.[0]?.text || "Chưa nhận được câu trả lời.";
        reply = reply.replace(/[*#_~`]/g, '');

        addAIMessage(reply);

    } catch (error) {
        loading.remove();
        addAIMessage("Lỗi mạng internet. Bạn kiểm tra lại kết nối Wifi/4G nhé.");
    }
}

function sendQuickPrompt(promptText) {
    input.value = promptText;
    sendMessage();
}

function addUserMessage(text) {
    const message = document.createElement("div");
    message.className = "message user";
    message.innerHTML = `<div class="user-avatar">👤</div><div class="content-bubble"></div>`;
    message.querySelector(".content-bubble").textContent = text;
    chat.appendChild(message);
    scrollBottom();
}

function addAIMessage(text) {
    const message = document.createElement("div");
    message.className = "message assistant";

    const avatar = document.createElement("div");
    avatar.className = "ai-avatar";
    avatar.textContent = "嵐";

    const content = document.createElement("div");
    content.className = "content-bubble";
    content.textContent = text;

    if (text !== "Đang suy nghĩ...") {
        const controls = document.createElement("div");
        controls.className = "speaking-box";

        const speak = document.createElement("button");
        speak.className = "speak-btn";
        speak.innerHTML = "🔊 Bấm để nghe";
        speak.onclick = () => speakText(text, speak);

        controls.appendChild(speak);
        content.appendChild(controls);
    }

    message.appendChild(avatar);
    message.appendChild(content);
    chat.appendChild(message);

    scrollBottom();
    return message;
}

function speakText(text, button) {
    if (!text) return;
    
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const cleanText = text.replace(/[*#_~`]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'vi-VN';
        
        if (button) button.innerHTML = "🔊 Đang đọc...";

        utterance.onend = () => {
            if (button) button.innerHTML = "🔊 Bấm để nghe lại";
        };
        utterance.onerror = () => {
            if (button) button.innerHTML = "🔊 Bấm để nghe lại";
        };

        window.speechSynthesis.speak(utterance);
    } else {
        if (button) button.innerHTML = "Trình duyệt không hỗ trợ đọc";
    }
}

let recognition = null;
let isRecording = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "vi-VN";
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "🔴";
    };

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
        autoResize();
    };

    recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎙️";
    };

    recognition.onerror = () => {
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎙️";
    };
}

function toggleVoice() {
    if (!recognition) {
        alert("Thiết bị hoặc trình duyệt chưa hỗ trợ micro web.");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        recognition.start();
    }
}

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

input.addEventListener("input", autoResize);
function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 100) + "px";
}

function newChat() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    chat.innerHTML = `
        <div class="message assistant">
            <div class="ai-avatar">嵐</div>
            <div class="content-bubble">
                Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?
                <div class="speaking-box">
                    <button class="speak-btn" onclick="speakText('Xin chào! Tôi là Storm Watch AI. Bạn cần tôi hỗ trợ thông tin thời tiết hay dông lốc Phan Thiết hôm nay?', this)">🔊 Bấm để nghe</button>
                </div>
            </div>
        </div>
    `;
}

function scrollBottom() {
    setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}
</script>

</body>
</html>
