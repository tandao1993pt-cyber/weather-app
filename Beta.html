<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bản Đồ Mây Vệ Tinh</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { margin: 0; padding: 0; height: 100%; width: 100%; background: #0f172a; }
        /* Xóa sạch logo và dòng chữ chân trang */
        .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ xem toàn cảnh Việt Nam & Đông Nam Á
        const map = L.map('map', {
            center: [16.0, 108.0],
            zoom: 5,
            minZoom: 3,
            maxZoom: 9
        });

        // 2. Nền bản đồ tối giản (để nổi bật khối mây)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 9
        }).addTo(map);

        // 3. Tải trực tiếp lớp MÂY VỆ TINH HỒNG NGOẠI
        async function loadSatelliteClouds() {
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await response.json();
                
                // Gọi luồng ảnh vệ tinh mây thay vì ra-đa mưa
                if (data && data.satellite && data.satellite.infrared) {
                    const satFrames = data.satellite.infrared;
                    const latestFrame = satFrames[satFrames.length - 1];
                    
                    L.tileLayer(`https://tilecache.rainviewer.com/v2/satellite/${latestFrame.time}/256/{z}/{x}/{y}/0/0_0.png`, {
                        opacity: 0.85,
                        maxZoom: 9
                    }).addTo(map);
                }
            } catch (err) {
                console.error("Lỗi kết nối máy chủ mây:", err);
            }
        }

        loadSatelliteClouds();
    </script>
</body>
</html>
