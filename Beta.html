<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bản Đồ Thời Tiết Đa Lớp</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; background: #121212; }
        .leaflet-control-attribution { display: none !important; }
        
        /* Tùy chỉnh bảng chọn lớp ở góc màn hình */
        .leaflet-control-layers {
            background: rgba(15, 23, 42, 0.9) !important;
            color: #fff !important;
            border-radius: 8px !important;
            padding: 6px 10px !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Tạo các bản đồ nền để chuyển đổi
        const nenGiaoThong = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 });
        const nenToi = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 });

        // 2. Khởi tạo bản đồ chính
        const map = L.map('map', {
            center: [16.04, 108.2],
            zoom: 6,
            minZoom: 3,
            maxZoom: 18,
            layers: [nenGiaoThong] // Nền mặc định khi mở app
        });

        // Khai báo các lớp dữ liệu thời tiết
        let lopMayVeTinh = L.layerGroup();
        let lopRadaMua = L.layerGroup();

        // 3. Danh sách điều khiển (Menu góc trên bên phải)
        const danhSachNen = {
            "Bản đồ Giao thông": nenGiaoThong,
            "Bản đồ Chế độ tối": nenToi
        };

        const danhSachThoiTiet = {
            "Mây Vệ Tinh (Toàn cảnh)": lopMayVeTinh,
            "Ra-đa Quét Mưa": lopRadaMua
        };

        // Thêm bảng chọn vào góc màn hình
        L.control.layers(danhSachNen, danhSachThoiTiet, { collapsed: false }).addTo(map);

        // 4. Lấy dữ liệu thời tiết thực từ máy chủ
        async function loadData() {
            try {
                const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await res.json();
                const host = data.host || 'https://tilecache.rainviewer.com';

                // Tải Mây Vệ Tinh vào lớp Mây
                if (data.satellite && data.satellite.infrared) {
                    const latestSat = data.satellite.infrared[data.satellite.infrared.length - 1];
                    L.tileLayer(`${host}${latestSat.path}/256/{z}/{x}/{y}/0/0_0.png`, {
                        opacity: 0.6,
                        maxZoom: 18,
                        maxNativeZoom: 8
                    }).addTo(lopMayVeTinh);
                    lopMayVeTinh.addTo(map); // Bật sẵn mây khi mở app
                }

                // Tải Ra-đa Mưa vào lớp Mưa
                if (data.radar && data.radar.past) {
                    const latestRadar = data.radar.past[data.radar.past.length - 1];
                    L.tileLayer(`${host}${latestRadar.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.8,
                        maxZoom: 18,
                        maxNativeZoom: 8
                    }).addTo(lopRadaMua);
                    lopRadaMua.addTo(map); // Bật sẵn mưa khi mở app
                }
            } catch (err) {
                console.error("Lỗi tải dữ liệu", err);
            }
        }

        loadData();
    </script>
</body>
</html>
