<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TropicalTidbits Forecast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
        
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; width: 100%; max-width: 900px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h3 { color: #38bdf8; margin-bottom: 8px; font-size: 16px; }
        p { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }
        
        .img-container { width: 100%; overflow: hidden; border-radius: 8px; background: #000; min-height: 250px; display: flex; align-items: center; justify-content: center; }
        img { width: 100%; height: auto; display: block; border-radius: 8px; }
        
        .btn-refresh { margin-top: 12px; padding: 10px 16px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-refresh:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h3> TropicalTidbits - Mô Hình Dự Báo GFS</h3>
        <p>Ảnh biểu đồ thời tiết / áp suất / mây nhiệt đới cập nhật từ máy chủ</p>
        
        <div class="img-container">
            <img id="tidbits-img" src="" alt="Đang tải dữ liệu TropicalTidbits..." />
        </div>

        <button class="btn-refresh" onclick="loadTidbitsImage()">🔄 Cập nhật ảnh mới nhất</button>
    </div>

    <script>
        function loadTidbitsImage() {
            const img = document.getElementById('tidbits-img');
            // Đường dẫn lấy ảnh biểu đồ mô hình GFS khu vực Tây Thái Bình Dương / Đông Nam Á từ TropicalTidbits
            const timestamp = new Date().getTime();
            img.src = "https://www.tropicaltidbits.com/analysis/models/gfs/latest/gfs_mslp_pcpn_wpac_1.png?t=" + timestamp;
        }

        // Tải ảnh ngay khi mở trang
        loadTidbitsImage();
    </script>
</body>
</html>
