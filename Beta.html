<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bản Đồ Mây & Thời Tiết</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; background: #121212; }
        
        /* Xóa sạch logo và dòng chữ bản quyền */
        .leaflet-control-attribution { display: none !important; }
        
        /* Bảng trạng thái */
        #status-box {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <div id="status-box">Đang kết nối dữ liệu vệ tinh...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const statusBox = document.getElementById('status-box');

        // 1. Khởi tạo bản đồ
        const map = L.map('map', {
            center: [16.04, 108.2],
            zoom: 6,
            minZoom: 3,
            maxZoom: 18,
            attributionControl: false
        });

        // 2. Nền bản đồ chuẩn OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18
        }).addTo(map);

        // 3. Tải dữ liệu mây & ra-đa không bị mất khi zoom gần
        async function loadWeatherData() {
            try {
                const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                if (!res.ok) throw new Error('Lỗi kết nối API');
                
                const data = await res.json();
                const host = data.host || 'https://tilecache.rainviewer.com';

                // Lớp MÂY VỆ TINH
                if (data.satellite && data.satellite.infrared && data.satellite.infrared.length > 0) {
                    const latestSat = data.satellite.infrared[data.satellite.infrared.length - 1];
                    const satUrl = `${host}${latestSat.path}/256/{z}/{x}/{y}/0/0_0.png`;
                    
                    L.tileLayer(satUrl, {
                        opacity: 0.6,
                        maxZoom: 18,
                        maxNativeZoom: 8 // BẮT BUỘC: Giữ mây không bị mất khi zoom gần
                    }).addTo(map);
                }

                // Lớp RA-ĐA MƯA
                if (data.radar && data.radar.past && data.radar.past.length > 0) {
                    const latestRadar = data.radar.past[data.radar.past.length - 1];
                    const radarUrl = `${host}${latestRadar.path}/256/{z}/{x}/{y}/2/1_1.png`;
                    
                    L.tileLayer(radarUrl, {
                        opacity: 0.8,
                        maxZoom: 18,
                        maxNativeZoom: 8 // BẮT BUỘC: Giữ ra-đa mưa không bị mất khi zoom gần
                    }).addTo(map);
                }

                statusBox.innerText = 'Cập nhật thành công (Đã bật hỗ trợ zoom gần)';
                statusBox.style.color = '#4ade80';
            } catch (err) {
                console.error(err);
                statusBox.innerText = 'Lỗi tải dữ liệu!';
                statusBox.style.color = '#f87171';
            }
        }

        loadWeatherData();
    </script>
</body>
</html>
