<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bản Đồ Thời Tiết</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; background: #121212; }
        
        /* Xóa sạch dòng chữ bản quyền ở chân trang */
        .leaflet-control-attribution { display: none !important; }
        
        /* Bảng điều khiển góc trái */
        #control-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-family: sans-serif;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 200px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <div id="status-text" style="font-weight: bold; color: #38bdf8; margin-bottom: 4px;">Đang kết nối...</div>
        
        <button class="btn active" id="btn-cloud" onclick="toggleCloud()">Mây Vệ Tinh: BẬT</button>
        <button class="btn active" id="btn-radar" onclick="toggleRadar()">Ra-đo Mưa: BẬT</button>
        <button class="btn" style="margin-top: 12px; background: #334155; color: #fff;" onclick="locateUser()">📍 Định Vị Vị Trí</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ và chuyển cụm nút Zoom (+/-) sang góc phải
        const map = L.map('map', {
            center: [16.04, 108.2],
            zoom: 6,
            minZoom: 3,
            maxZoom: 18,
            zoomControl: false,
            attributionControl: false
        });

        L.control.zoom({ position: 'topright' }).addTo(map);

        // 2. Bản đồ nền OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18
        }).addTo(map);

        let cloudLayer = null;
        let radarLayer = null;
        let showCloud = true;
        let showRadar = true;

        // 3. Tải dữ liệu mây và mưa
        async function loadWeather() {
            const statusText = document.getElementById('status-text');
            try {
                const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                if (!res.ok) throw new Error('Không tải được API');
                
                const data = await res.json();
                const host = data.host || 'https://tilecache.rainviewer.com';

                // Lấy ảnh mây vệ tinh mới nhất
                if (data.satellite && data.satellite.infrared && data.satellite.infrared.length > 0) {
                    const lastSat = data.satellite.infrared[data.satellite.infrared.length - 1];
                    cloudLayer = L.tileLayer(`${host}${lastSat.path}/256/{z}/{x}/{y}/0/0_0.png`, {
                        opacity: 0.55,
                        maxZoom: 18,
                        maxNativeZoom: 8
                    });
                    if (showCloud) cloudLayer.addTo(map);
                }

                // Lấy ảnh ra-đa mưa mới nhất
                if (data.radar && data.radar.past && data.radar.past.length > 0) {
                    const lastRadar = data.radar.past[data.radar.past.length - 1];
                    radarLayer = L.tileLayer(`${host}${lastRadar.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0.75,
                        maxZoom: 18,
                        maxNativeZoom: 8
                    });
                    if (showRadar) radarLayer.addTo(map);
                }

                statusText.innerText = 'Cập nhật thành công!';
                statusText.style.color = '#4ade80';
            } catch (err) {
                console.error(err);
                statusText.innerText = 'Lỗi tải dữ liệu!';
                statusText.style.color = '#f87171';
            }
        }

        // 4. Bật / Tắt lớp mây
        function toggleCloud() {
            showCloud = !showCloud;
            const btn = document.getElementById('btn-cloud');
            if (showCloud) {
                btn.innerText = 'Mây Vệ Tinh: BẬT';
                btn.classList.add('active');
                if (cloudLayer) cloudLayer.addTo(map);
            } else {
                btn.innerText = 'Mây Vệ Tinh: TẮT';
                btn.classList.remove('active');
                if (cloudLayer) map.removeLayer(cloudLayer);
            }
        }

        // 5. Bật / Tắt lớp ra-đa mưa
        function toggleRadar() {
            showRadar = !showRadar;
            const btn = document.getElementById('btn-radar');
            if (showRadar) {
                btn.innerText = 'Ra-đo Mưa: BẬT';
                btn.classList.add('active');
                if (radarLayer) radarLayer.addTo(map);
            } else {
                btn.innerText = 'Ra-đo Mưa: TẮT';
                btn.classList.remove('active');
                if (radarLayer) map.removeLayer(radarLayer);
            }
        }

        // 6. Định vị GPS người dùng
        function locateUser() {
            map.locate({ setView: true, maxZoom: 11 });
        }

        map.on('locationfound', (e) => {
            L.marker(e.latlng).addTo(map).bindPopup("Vị trí của bạn").openPopup();
        });

        loadWeather();
    </script>
</body>
</html>
