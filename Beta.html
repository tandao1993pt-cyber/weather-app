<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bản đồ thời tiết chuyên nghiệp</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
        /* Ẩn hoàn toàn logo và dòng chữ bản quyền */
        .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ
        const map = L.map('map', {
            center: [16.0, 108.0],
            zoom: 6,
            attributionControl: false // Tắt luôn thanh bản quyền
        });

        // 2. Lớp bản đồ nền vệ tinh (không chứa logo)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18
        }).addTo(map);

        // 3. Tự động lấy dữ liệu mây/mưa từ RainViewer
        async function loadWeather() {
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await response.json();
                const latest = data.radar.past[data.radar.past.length - 1];
                
                // Thêm lớp mây/mưa vào bản đồ
                L.tileLayer(`https://tilecache.rainviewer.com/v2/radar/${latest.time}/256/{z}/{x}/{y}/2/1_1.png`, {
                    opacity: 0.7
                }).addTo(map);
                
                console.log("Đã tải dữ liệu thời tiết thành công!");
            } catch (e) {
                console.log("Lỗi tải dữ liệu, đang thử lại...");
            }
        }

        loadWeather();
    </script>
</body>
</html>
