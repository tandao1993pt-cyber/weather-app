<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bản Đồ Mây Mưa Thời Tiết</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; background: #0f172a; }
        
        /* Ẩn dòng chữ bản quyền chân trang */
        .leaflet-control-attribution { display: none !important; }

        /* Bảng điều khiển góc trái */
        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-family: sans-serif;
            font-size: 13px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            width: 180px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div id="panel">
        <div id="status-text" style="font-weight: bold; color: #eab308; margin-bottom: 6px;">Đang tải dữ liệu...</div>
        <button class="btn active" id="btn-cloud" onclick="toggleCloud()">Mây Vệ Tinh</button>
        <button class="btn active" id="btn-radar" onclick="toggleRadar()">Ra-đo Mưa</button>
        <button class="btn" style="margin-top: 10px; background: #334155; color: #fff;" onclick="locateUser()">📍 Vị Trí Của Tôi</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Khởi tạo bản đồ - Đưa nút Zoom (+/-) sang góc phải
        const map = L.map('map', {
            center: [16.04, 108.2],
            zoom: 6,
            minZoom: 3,
            maxZoom: 18,
            zoomControl: false,
            attributionControl: false
        });

        L.control.zoom({ position: 'topright' }).addTo(map);

        // 2. Lớp bản đồ nền chuẩn
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18
        }).addTo(map);

        let cloudLayer = null;
        let radarLayer = null;
        let isCloudOn = true;
        let isRadarOn = true;

        // 3. Hàm tải dữ liệu mây & mưa (Đã sửa triệt để lỗi chuỗi URL)
        async function fetchWeatherData() {
            const statusText = document.getElementById('status-text');
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                if (!response.ok) throw new Error('Không thể lấy dữ liệu API');
                
                const data = await response.json();
                const host = data.host || 'https://tilecache.rainviewer.com';

                // Tải MÂY VỆ TINH
                if (data.satellite && data.satellite.infrared && data.satellite.infrared.length > 0) {
                    const lastSat = data.satellite.infrared[data.satellite.infrared.length - 1];
                    // Nối chuỗi thủ công để tránh lỗi Javascript
                    const satUrl = host + lastSat.path + '/256/{z}/{x}/{y}/0/0_0.png';
                    
                    cloudLayer = L.tileLayer(satUrl, {
                        opacity: 0.6,
                        maxZoom: 18,
                        maxNativeZoom: 8
                    });
                    if (isCloudOn) cloudLayer.addTo(map);
                }

                // Tải RA-ĐA MƯA
                if (data.radar && data.radar.past && data.radar.past.length > 0) {
                    const lastRadar = data.radar.past[data.radar.past.length - 1];
                    // Nối chuỗi thủ công để tránh lỗi Javascript
                    const radarUrl = host + lastRadar.path + '/256/{z}/{x}/{y}/2/1_1.png';
                    
                    radarLayer = L.tileLayer(radarUrl, {
                        opacity: 0.8,
                        maxZoom: 18,
                        maxNativeZoom: 8
                    });
                    if (isRadarOn) radarLayer.addTo(map);
                }

                statusText.innerText = 'Đã tải xong mây mưa!';
                statusText.style.color = '#4ade80';
            } catch (err) {
                console.error("Lỗi:", err);
                statusText.innerText = 'Lỗi kết nối mây mưa!';
                statusText.style.color = '#f87171';
            }
        }

        // 4. Bật / Tắt Mây
        function toggleCloud() {
            isCloudOn = !isCloudOn;
            document.getElementById('btn-cloud').classList.toggle('active', isCloudOn);
            if (cloudLayer) {
                if (isCloudOn) map.addLayer(cloudLayer);
                else map.removeLayer(cloudLayer);
            }
        }

        // 5. Bật / Tắt Mưa
        function toggleRadar() {
            isRadarOn = !isRadarOn;
            document.getElementById('btn-radar').classList.toggle('active', isRadarOn);
            if (radarLayer) {
                if (isRadarOn) map.addLayer(radarLayer);
                else map.removeLayer(radarLayer);
            }
        }

        // 6. Định vị GPS
        function locateUser() {
            map.locate({ setView: true, maxZoom: 10 });
        }

        map.on('locationfound', (e) => {
            L.marker(e.latlng).addTo(map).bindPopup("Vị trí của bạn").openPopup();
        });

        // Chạy tải dữ liệu
        fetchWeatherData();
    </script>
</body>
</html>
